# The runner: inside the internal zone, unreachable from the DMZ, and serving
# public HTTP traffic anyway.
#
# It has no Service and no inbound port for gateway traffic. It does not need
# one. It is a CLIENT of the gateway (ADR-0038 §4), which is what makes the
# deny-all-ingress-from-DMZ policy survivable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shift-runner-flows
  namespace: shift-internal
data:
  # The flow the gateway route names. Registered on the runner at start-up by
  # the sidecar below; in a real deployment the hub syncs it.
  echo.json: |
    {
      "document": {
        "name": "echo",
        "source": {"connector": "@webhook"},
        "sink": {"connector": "@response"}
      }
    }
  # A v3 DAG flow: fan-out AND fan-in in one graph (ADR-0029). The tee
  # duplicates every record to both branches and the merge concatenates them,
  # so one record in comes back as two — which is what makes the topology
  # visible in the response rather than something you have to take on trust.
  #
  # Graphs like this were validated by the hub and drawable on the canvas but
  # NOT executable until the general segment compiler landed (issue #59), so
  # this doubles as the deployment-level check that they now run.
  fanout.json: |
    {
      "document": {
        "name": "fanout",
        "start": "in",
        "steps": [
          {"id": "in", "type": "source", "connector": "@webhook", "action": "ndjson", "onSuccess": "t"},
          {"id": "t", "type": "tee", "branches": ["a", "b"]},
          {"id": "a", "type": "filter", "path": "$.id", "op": "exists", "onComplete": "m"},
          {"id": "b", "type": "filter", "path": "$.id", "op": "exists", "onComplete": "m"},
          {"id": "m", "type": "merge", "inputs": ["a", "b"], "mode": "concat", "onSuccess": "out"},
          {"id": "out", "type": "sink", "connector": "@response"}
        ]
      }
    }
---
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shift-runner-state
  namespace: shift-internal
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shift-runner
  namespace: shift-internal
spec:
  replicas: 1
  strategy:
    type: Recreate # one RWO credential volume; never two writers
  selector:
    matchLabels:
      app: shift-runner
  template:
    metadata:
      labels:
        app: shift-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runnerd
          image: shift/runnerd:dev
          imagePullPolicy: IfNotPresent
          args:
            - -listen=127.0.0.1:8340
            # NO -gateways. The hub computes the list and the runner
            # DISCOVERS it (ADR-0038 §4) — it already holds the gateway records
            # and this runner's labels, so a new DMZ host is not a fleet-wide
            # redeploy.
            #
            # It is also the only list whose entries can be VERIFIED. A
            # hub-issued gateway certificate carries no subject alternative
            # name (a DMZ box has no stable hostname at issue time), so the
            # runner pins the gateway's hub-assigned id from the same answer
            # that gave it the address. A statically configured address has no
            # id to pin and falls back to hostname verification, which such a
            # certificate cannot satisfy.
            # NOTE: placement labels are NOT set here. ADR-0041 made them
            # hub-asserted — the runner proves WHO it is (mTLS identity), the
            # hub says WHAT it is (labels) — precisely so a runner cannot
            # place itself on a route by editing its own arguments. There is
            # no hub in this bundle, so this runner carries no labels and the
            # route below carries no selector.
            # Stands in for the hub's webhook sync while these demo flows are
            # file-provided; the hub is authoritative when attached.
            - -flows-dir=/etc/shift/flows
          env:
            # The hub. Registering with it is what gets this runner an mTLS
            # IDENTITY (ADR-0044), and that identity is what lets it poll a
            # gateway at all: off-loopback gateway traffic requires mTLS on
            # both halves (ADR-0041), so a runner with no control plane now
            # refuses to start rather than falling back to a shared secret it
            # cannot verify the gateway with.
            - name: SHIFT_HUB_URL
              value: https://hubd.shift-internal.svc.cluster.local:8400
            - name: SHIFT_HUB_CA_FILE
              value: /bootstrap/ca.pem
            # Registration tokens are single-use; the persisted identity is
            # what keeps a restart working.
            - name: SHIFT_HUB_REG_TOKEN_FILE
              value: /bootstrap/runner-token
            - name: SHIFT_HUB_CRED_FILE
              value: /var/lib/shift/runner-cred.json
            # The private key is the runner's ALONE — on its own volume, never
            # the shared bootstrap one that several pods mount.
            - name: SHIFT_RUNNER_IDENTITY_DIR
              value: /var/lib/shift/identity
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: flows
              mountPath: /etc/shift/flows
              readOnly: true
            - name: scratch
              mountPath: /tmp
            # The bootstrap volume carries the hub CA and the single-use
            # registration token. Read-only: the runner consumes this material,
            # it never writes to the shared bundle.
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            # The runner's OWN state: its mTLS private key and issued
            # certificate. Deliberately not the shared volume — the key is the
            # runner's alone, and a bundle several pods mount is the wrong
            # place for it.
            - name: state
              mountPath: /var/lib/shift
      volumes:
        - name: flows
          configMap:
            name: shift-runner-flows
        - name: bootstrap
          persistentVolumeClaim:
            claimName: shift-bootstrap
        # A PVC, not an emptyDir, and the reason is a bug this bundle used to
        # have: the runner's hub CREDENTIAL lives here. The registration token
        # that obtains it is SINGLE-USE by design, so a runner that lost its
        # credential on every restart would try to register again with a token
        # already burned — and stay 401 forever. Persisting the credential is
        # what makes a restart a restart rather than a re-install.
        - name: state
          persistentVolumeClaim:
            claimName: shift-runner-state
        - name: scratch
          emptyDir: {}
