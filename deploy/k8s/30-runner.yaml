# The runner: inside the internal zone, unreachable from the DMZ, and serving
# public HTTP traffic anyway.
#
# It has no Service and no inbound port for gateway traffic. It does not need
# one. It is a CLIENT of the gateway (ADR-0038 §4), which is what makes the
# deny-all-ingress-from-DMZ policy survivable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shift-runner-flows
  namespace: shift-internal
data:
  # The flow the gateway route names. Registered on the runner at start-up by
  # the sidecar below; in a real deployment the hub syncs it.
  echo.json: |
    {
      "document": {
        "name": "echo",
        "source": {"connector": "@webhook"},
        "sink": {"connector": "@response"}
      }
    }
  # A v3 DAG flow: fan-out AND fan-in in one graph (ADR-0029). The tee
  # duplicates every record to both branches and the merge concatenates them,
  # so one record in comes back as two — which is what makes the topology
  # visible in the response rather than something you have to take on trust.
  #
  # Graphs like this were validated by the hub and drawable on the canvas but
  # NOT executable until the general segment compiler landed (issue #59), so
  # this doubles as the deployment-level check that they now run.
  fanout.json: |
    {
      "document": {
        "name": "fanout",
        "start": "in",
        "steps": [
          {"id": "in", "type": "source", "connector": "@webhook", "action": "ndjson", "onSuccess": "t"},
          {"id": "t", "type": "tee", "branches": ["a", "b"]},
          {"id": "a", "type": "filter", "path": "$.id", "op": "exists", "onComplete": "m"},
          {"id": "b", "type": "filter", "path": "$.id", "op": "exists", "onComplete": "m"},
          {"id": "m", "type": "merge", "inputs": ["a", "b"], "mode": "concat", "onSuccess": "out"},
          {"id": "out", "type": "sink", "connector": "@response"}
        ]
      }
    }
---
# The runner's copy of the gateway control secret. A Secret cannot be mounted
# across namespaces, so the value appears in both — which is honest about what
# a shared secret costs, and part of why ADR-0038 §6a moves to mTLS.
apiVersion: v1
kind: Secret
metadata:
  name: shift-gateway-control
  namespace: shift-internal
stringData:
  token: dev-control-secret-not-for-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shift-runner
  namespace: shift-internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shift-runner
  template:
    metadata:
      labels:
        app: shift-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runnerd
          image: shift/runnerd:dev
          imagePullPolicy: IfNotPresent
          args:
            - -listen=127.0.0.1:8340
            # BOTH gateway replicas, addressed individually. Going through the
            # headless service name would resolve to one arbitrary pod and
            # strand the other (ADR-0038 §4a). The hub computes this list in a
            # real deployment — it already holds the gateway records and the
            # runner labels.
            - -gateways=http://shift-gateway-0.shift-gateway-control.shift-dmz.svc.cluster.local:8444,http://shift-gateway-1.shift-gateway-control.shift-dmz.svc.cluster.local:8444
            # NOTE: placement labels are NOT set here. ADR-0041 made them
            # hub-asserted — the runner proves WHO it is (mTLS identity), the
            # hub says WHAT it is (labels) — precisely so a runner cannot
            # place itself on a route by editing its own arguments. There is
            # no hub in this bundle, so this runner carries no labels and the
            # route below carries no selector.
            # Stands in for the hub's webhook sync, which is what supplies
            # flows in a real deployment.
            - -flows-dir=/etc/shift/flows
          env:
            # The same shared secret the gateway requires. Mirrored here rather
            # than shared via a common Secret because the two live in different
            # namespaces — and in a real deployment the hub distributes it.
            - name: SHIFT_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shift-gateway-control
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: flows
              mountPath: /etc/shift/flows
              readOnly: true
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: flows
          configMap:
            name: shift-runner-flows
        - name: scratch
          emptyDir: {}
