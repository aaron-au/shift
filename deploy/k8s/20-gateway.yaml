# The gateway: the sole publicly reachable component (ADR-0038).
#
# It holds NO configuration of its own. No routes file, no roster, no
# hand-placed certificate — it starts empty, generates its own key, and waits
# to be adopted by the hub (ADR-0049). Everything it serves arrives over the
# control channel: routes, the runner roster, its own identity.
#
# That is not just tidiness. Placement is hub-asserted (ADR-0041) — the runner
# proves WHO it is with a client certificate, the hub says WHAT it is — so the
# roster CANNOT be a static file here without the DMZ box becoming the
# authority on which runners are legitimate. The gateway fails closed on a
# runner it has not been vouched for, which is why an unadopted gateway
# refuses every poll rather than serving traffic to whoever shows up.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shift-gateway
  namespace: shift-dmz
spec:
  # A StatefulSet rather than a Deployment, for one reason: STABLE PER-POD DNS.
  #
  # A runner must address each gateway individually (a poll parked on replica 1
  # is only usable by replica 1), so it needs a name per replica —
  # shift-gateway-0.shift-gateway-control, shift-gateway-1.… — not a single
  # rotating VIP. Nothing here is stateful; the gateway holds no disk at all.
  #
  # It is also not a misuse of the abstraction: under ADR-0038 §6a each gateway
  # has a real identity (its mTLS bundle), which is exactly what a StatefulSet
  # models.
  serviceName: shift-gateway-control
  # Two replicas, because HA is a property worth demonstrating rather than
  # asserting: each holds its OWN poll registry, and the runner polls both.
  replicas: 2
  selector:
    matchLabels:
      app: shift-gateway
  template:
    metadata:
      labels:
        app: shift-gateway
    spec:
      # The DMZ box runs as little as possible: no service account token (it
      # has no reason to talk to the API server), read-only root, no
      # privileges to drop later.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gatewayd
          image: shift/gatewayd:dev
          imagePullPolicy: IfNotPresent
          args:
            - -public=:8443
            # Binds all interfaces because runners reach it from another pod.
            # The NetworkPolicy above is what keeps this port internal-only —
            - -control=:8444
            # Adoption state (ADR-0049). The gateway generates its own key
            # here and waits; the hub dials, proves it holds this gateway's
            # one-time install token, and issues the identity. No -identity:
            # the hand-placed bundle is superseded, and two sources of identity
            # is one too many (the binary refuses both together).
            #
            # No -config either. Routes and the runner roster are hub state,
            # pushed over this same channel.
            - -state=/state
          env:
            # Each replica is a SEPARATE gateway with its own hub record, its
            # own install token and its own identity — so the token file is
            # selected by pod name. Kubernetes expands $(VAR) from earlier env
            # entries, which is what makes one Secret serve both replicas
            # without either being able to read the other's token by accident.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SHIFT_GATEWAY_INSTALL_TOKEN_FILE
              value: /install/$(POD_NAME)
          # No SHIFT_GATEWAY_CONTROL_TOKEN. The shared secret is gone from
          # this bundle deliberately: it authenticated the CALLER to the
          # gateway and told the runner nothing about the gateway, so it was
          # the half of the problem that did not matter. mTLS replaces it in
          # both directions.
          ports:
            - name: public
              containerPort: 8443
            - name: control
              containerPort: 8444
          volumeMounts:
            - name: state
              mountPath: /state
            - name: install
              mountPath: /install
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # A TCP probe, and that is a consequence of mTLS rather than a
          # shortcut. The control listener requires a client certificate on
          # EVERY connection — there is no unauthenticated /healthz — so the
          # kubelet, which holds no identity in this trust domain, cannot make
          # an application-level check. Issuing it one would mean minting a
          # control-plane certificate for the orchestrator, which is a much
          # worse trade than a weaker probe.
          #
          # What this still proves is what readiness is for here: the process
          # is up and the listener is accepting. Whether the gateway can serve
          # is answered by /healthz on the PUBLIC port, which is where an
          # operator looks anyway.
          readinessProbe:
            tcpSocket:
              port: control
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        # The one-time install tokens, one key per pod name. This is a
        # BOOTSTRAP credential, not a standing one: it proves the pairing
        # exchange once and is burned at adoption, after which the gateway's
        # own key is pinned by the hub and the token is worthless. Nothing in
        # the DMZ reaches inward to fetch it — the material is pushed to the
        # DMZ, the same direction rule as everything else (ADR-0038 §2).
        - name: install
          secret:
            secretName: shift-gateway-install
            # 0444, not 0400: the container runs as UID 65532 and a Secret's
            # files are owned by root, so owner-only would be unreadable by the
            # process that needs them. Confidentiality rests on Kubernetes RBAC
            # over the Secret, not on file mode inside a pod that holds nothing
            # else.
            defaultMode: 0444
  # Per-pod, because adoption state is the one thing a gateway must survive a
  # restart with. The install token is single-use; a gateway that lost its
  # anchor key on every reschedule would need re-issuing by hand each time.
  # It holds a key and a certificate — no payload, no configuration of record.
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 32Mi
---
# The public front door. NodePort so `minikube service` can reach it without
# a cloud load balancer.
apiVersion: v1
kind: Service
metadata:
  name: shift-gateway
  namespace: shift-dmz
spec:
  type: NodePort
  selector:
    app: shift-gateway
  ports:
    - name: public
      port: 8443
      targetPort: public
      nodePort: 30443
---
# A HEADLESS service for the control listener, and the reason is the one
# non-obvious thing in this whole bundle.
#
# A poll parked on gateway replica 1 is only usable by replica 1. A normal
# ClusterIP would load-balance each poll to one arbitrary replica, so a runner
# would end up parked on one gateway and invisible to the other — and requests
# arriving at the other would 503 while a perfectly good runner sat idle.
#
# Headless gives the runner the individual pod addresses, so it can park on
# every replica. Runners address each gateway INDIVIDUALLY, never a VIP
# (ADR-0038 §4a).
apiVersion: v1
kind: Service
metadata:
  name: shift-gateway-control
  namespace: shift-dmz
spec:
  clusterIP: None
  selector:
    app: shift-gateway
  ports:
    - name: control
      port: 8444
      targetPort: control
